# What the machine's public sites share (units/public-sites). A site is a
# server block of its own in /etc/nginx/sites-enabled, on this machine only:
#
#   server {
#     listen 443 ssl;
#     server_name <site>.<name>.duckdns.org;
#     include /etc/nginx/public-sites/<site>-auth*.conf;
#     location / { proxy_pass http://127.0.0.1:<port>; }
#   }
#
# The include is the site's login: `public-sites password <site> <user>`
# writes the file it matches, `public-sites no-password <site>` removes it.

# The wildcard certificate, for every server that listens with ssl
ssl_certificate /etc/nginx/certs/public-sites.crt;
ssl_certificate_key /etc/nginx/certs/public-sites.key;

# http://<site>.<name>.duckdns.org continues on https
server {
  listen 80;
  server_name ~\.duckdns\.org$;
  return 301 https://$host$request_uri;
}

# https for a name that is no site: close the connection
server {
  listen 443 ssl default_server;
  server_name _;
  return 444;
}
