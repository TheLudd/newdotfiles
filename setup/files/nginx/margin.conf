# margin, the markdown reader/editor: http://margin.local is the margin user
# service, which itself only listens on 127.0.0.1:48217.
server {
  listen 80;
  server_name margin.local;

  # margin edits files, so keep it off the network like the service itself
  allow 127.0.0.1;
  allow ::1;
  deny all;

  # Saves send whole documents
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:48217;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # The live-update stream must reach the browser unbuffered and stay open
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
