# Terminal of the Wayland session, set up like st (~/code/st) is for X.
[main]
font=Liberation Mono:pixelsize=12, Noto Color Emoji:pixelsize=12, Hack Nerd Font Mono:pixelsize=12
pad=2x2

[cursor]
style=block

[colors-dark]
alpha=0.8
foreground=e5e5e5
background=000000
cursor=000000 cccccc
regular0=000000
regular1=cd0000
regular2=00cd00
regular3=cdcd00
regular4=00eeee
regular5=cd00cd
regular6=00ffff
regular7=e5e5e5
bright0=7f7f7f
bright1=ff0000
bright2=00ff00
bright3=ffff00
bright4=5c5cff
bright5=ff00ff
bright6=00ffff
bright7=ffffff

# git hashes, copied with Alt+h like st's copyhash
[regex:hashes]
regex=([a-fA-F0-9]{7,40})

[key-bindings]
font-increase=Control+Shift+Prior
font-decrease=Control+Shift+Next
font-reset=Control+Shift+Home
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert Control+Shift+y
show-urls-copy=Mod1+l
regex-copy=[hashes] Mod1+h
