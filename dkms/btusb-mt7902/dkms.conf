# btusb with the USB id of the Foxconn MediaTek MT7902 Bluetooth chip
# (0489:e156), which stock kernels lack. Registered by system/60-btusb-mt7902.
PACKAGE_NAME="btusb-mt7902"
PACKAGE_VERSION="1"
BUILT_MODULE_NAME[0]="btusb"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PRE_BUILD="fetch-source $kernelver"
AUTOINSTALL="yes"
